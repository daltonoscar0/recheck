[project]
name = "recheck"
version = "0.1.0"
description = "Cell-by-cell reproduction reports for ML/NLP papers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
recheck = "recheck.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: test requires outbound network access (deselect with '-m \"not network\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
